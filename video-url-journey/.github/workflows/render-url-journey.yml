name: Render TechOrbit URL Journey

on:
  push:
    branches: [video/url-journey-tanglish-v2]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Python TTS
        run: python3 -m pip install --upgrade edge-tts
      - name: Generate neural Telugu voiceover
        working-directory: video-url-journey
        run: |
          mkdir -p public out
          python3 - <<'PY'
          import asyncio
          import edge_tts
          async def main():
              text=open("voiceover.txt",encoding="utf-8").read()
              communicate=edge_tts.Communicate(text=text, voice="te-IN-ShrutiNeural", rate="+2%", volume="+0%")
              await communicate.save("public/voiceover.mp3")
          asyncio.run(main())
          PY
      - name: Generate subtle cinematic bed
        working-directory: video-url-journey
        run: |
          ffmpeg -y -f lavfi -i "sine=frequency=55:sample_rate=48000" -f lavfi -i "sine=frequency=110:sample_rate=48000" -filter_complex "[0:a]volume=0.07[a];[1:a]volume=0.025[b];[a][b]amix=inputs=2:duration=longest,afade=t=in:st=0:d=8,afade=t=out:st=585:d=15" -t 600 public/bg.mp3
      - name: Install video dependencies
        working-directory: video-url-journey
        run: npm install
      - name: Build check
        working-directory: video-url-journey
        run: npm run build
      - name: Render MP4
        working-directory: video-url-journey
        run: npx remotion render UrlJourney out/TechOrbit_URL_Journey_10min.mp4 --codec=h264 --crf=18
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: TechOrbit-URL-Journey-10min
          path: video-url-journey/out/TechOrbit_URL_Journey_10min.mp4
          retention-days: 14
